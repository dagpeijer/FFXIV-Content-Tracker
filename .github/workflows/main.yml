name: Build and Release ContentTracker

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download Dalamud dev files
        shell: pwsh
        run: |
          $dalamudUrl = "https://goatcorp.github.io/dalamud-distrib/latest.zip"
          $dalamudDir = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"

          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null

          Write-Host "Downloading Dalamud..."
          Invoke-WebRequest -Uri $dalamudUrl -OutFile "dalamud.zip"

          Write-Host "Extracting Dalamud to $dalamudDir"
          Expand-Archive -Path "dalamud.zip" -DestinationPath $dalamudDir -Force

          Remove-Item "dalamud.zip"

          Write-Host "Dalamud files:"
          Get-ChildItem $dalamudDir | Select-Object Name

      - name: Restore dependencies
        run: dotnet restore ContentTracker.csproj

      - name: Build Release
        run: dotnet build ContentTracker.csproj -c Release --no-restore

      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release

          Get-ChildItem "bin\Release" -File | Where-Object {
            $_.Extension -in ".dll", ".json"
          } | ForEach-Object {
            Copy-Item $_.FullName "release\$($_.Name)"
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"

          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "main") {
            $version = "manual"
          }

          Compress-Archive `
            -Path "release\*" `
            -DestinationPath "ContentTracker-$version.zip" `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContentTracker-build
          path: ContentTracker-*.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ContentTracker-*.zip
